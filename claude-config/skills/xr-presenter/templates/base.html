<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* ClaudeXR base: dark, high contrast, readable at ~1.2 m (1 CSS px = 1 mm on the panel). No external resources. */
*{box-sizing:border-box;margin:0}html,body{background:#15161a;color:#f2f2f2;font:28px/1.35 -apple-system,Roboto,sans-serif}
body{padding:36px}h1{font-size:44px;margin-bottom:24px}h2{font-size:32px;margin-bottom:12px}
.card{background:#22242b;border-radius:22px;padding:26px}.muted{color:#a8abb3}.accent{color:#D97757}
.grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
</style></head>
<body>
  <h1>Rubrik</h1>
  <div class="grid">
    <div class="card"><h2>Idé 1</h2><p class="muted">Kort förklaring.</p></div>
    <div class="card"><h2>Idé 2</h2><p class="muted">Kort förklaring.</p></div>
  </div>
</body></html>
